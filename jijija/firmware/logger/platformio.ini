; Creature OS — data logger firmware (Phase 1). NOT the creature runtime.
; Status: written without a compiler/board available; unverified until built and run on hardware.
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; If you use the board's native USB port (not the UART/CH343 port) for Serial, add:
;   build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    paulstoffregen/OneWire@^2.3.8
